# One-time setup of the second demo site (demo2.bizlogist.com) on the VPS.
# Run by hand: GitHub → Actions → "Set up demo2" → Run workflow.
#   step=all  copy the demo database into a NEW database, write ~/demo2/.env,
#             copy uploads, start the demo2 container, nginx site, and SSL once
#             the domain points at this server.
#   step=ssl  only the nginx site + SSL (run again after DNS has spread).
# Never overwrites: if the new database already exists, the copy is refused.
# The demo site, its database and its .env are only read, never changed.
# Afterwards every push to main updates both sites (deploy-VPS.yml).
name: Set up demo2

on:
  workflow_dispatch:
    inputs:
      step:
        description: "all = database + site + SSL, ssl = only nginx + SSL"
        type: choice
        options: [all, ssl, clear-transactions]
        default: all
      confirm:
        description: "For clear-transactions only: type CLEAR <new database name>"
        default: ""
      domain:
        description: "Address of the new site"
        default: demo2.bizlogist.com
      new_db:
        description: "Name of the new database (keep 'bizlogist_demo' in it)"
        default: bizlogist_demo2

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up demo2 on the VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2746
          command_timeout: 60m
          script: |
            set -eu
            STEP="${{ inputs.step }}"
            DOMAIN="${{ inputs.domain }}"
            NEW_DB="${{ inputs.new_db }}"
            PORT=3031
            IMAGE=ghcr.io/${{ secrets.GHCR_USERNAME }}/demo:latest
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO="sudo -n"

            case "$NEW_DB" in *bizlogist_demo*) ;; *) echo "Refusing: new database name must contain bizlogist_demo"; exit 1;; esac
            [ -f ~/demo/.env ] || { echo "~/demo/.env not found"; exit 1; }

            # DATABASE_URL of the demo site, without quotes and without ?schema=… (libpq does not know it).
            SRC_URL=$(grep -E '^DATABASE_URL=' ~/demo/.env | head -1 | cut -d= -f2- | tr -d '"'"'"'')
            SRC_PG=${SRC_URL%%\?*}
            SRC_DB=${SRC_PG##*/}
            BASE=${SRC_PG%/*}
            DST_PG="$BASE/$NEW_DB"
            [ "$SRC_DB" != "$NEW_DB" ] || { echo "Refusing: new database has the demo's own name"; exit 1; }
            echo "Demo database: $SRC_DB  →  new database: $NEW_DB  (host/user not printed)"

            # PostgreSQL tools in a throwaway container of the server's own major version.
            pg() { docker run --rm -i --network host -v /tmp/demo2-setup:/work "postgres:$PGV-alpine" "$@"; }
            mkdir -p /tmp/demo2-setup
            PGV=17
            PGV=$(pg psql "$SRC_PG" -tAc "SELECT current_setting('server_version_num')::int / 10000" | tr -d '[:space:]')
            echo "PostgreSQL server major version: $PGV"

            # step=clear-transactions — empty every transaction table of the NEW database
            # (setup / masters / users / settings / employees stay). One SQL transaction:
            # all or nothing. Never the demo's database. Maintenance SQL, not through the
            # app, so it is not in the audit trail (the audit log itself is emptied too).
            if [ "$STEP" = clear-transactions ]; then
              [ "${{ inputs.confirm }}" = "CLEAR $NEW_DB" ] || { echo "Refusing: type exactly 'CLEAR $NEW_DB' in confirm"; exit 1; }
              case "$DST_PG" in "$SRC_PG") echo "Refusing: that is the demo's database"; exit 1;; esac
              printf '%s\n' \
                "TRANSACTIONS_MASTER Transactions OrderMaster OrderDetail checks_in_hand INVOICE_KNOCKOFF INVOICE_KNOCKOFF_RUN" \
                "service_invoice_links SALE_RETURN_REMARK TAX_CHALLAN SALES_LOAN SALES_LOAN_LINE SALES_LOAN_RETURN" \
                "ApprovalRequest AuditLog Notification push_subscriptions Session VerificationToken" \
                "MonthlyOpeningStock MonthlyOpeningRate PeriodLock PeriodLockException PeriodLockLog" \
                "CostingPeriod FutureCosting ProductionCostEntry ProductionCostDetail" \
                "CustomerMonthlyTarget SALES_FORECAST INPUT_FOR_PP BiFollowup BiFollowupNote bi_events" \
                "productionPlanMaster productionPlanDetail productionPlanIssue productionPlanOutput productionPlanChangeLog" \
                "ReqMaster ReqDetail InboundMaster InboundDetail QUALITY_MASTER QUALITY_DETAIL QUALITY_DETAIL_DETAIL" \
                "PROCESS_SCAN_LOG LCMaster LCDetail pos_held_bills pos_payments pos_receipts pos_shifts" \
                "fixed_assets fixed_asset_depreciation_runs fixed_asset_depreciation_lines fixed_asset_disposals fixed_asset_movements" \
                "hr_attendance hr_punches hr_leave_requests hr_leave_balances hr_loans hr_loan_events hr_loan_recoveries" \
                "hr_off_swaps hr_payroll_runs hr_payslips hr_payroll_payments hr_separations hr_settlements" \
                "PayrollProcess PeriodicAttendance" | tr ' ' '\n' | grep . > /tmp/demo2-setup/clear-tables.txt
              LIST=$(awk '{printf "%s'"'"'%s'"'"'", (NR>1?",":""), $1}' /tmp/demo2-setup/clear-tables.txt)
              COUNTS="SELECT string_agg(t || '=' || n, '  ' ORDER BY t) FROM (SELECT t, (xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM %I', t), false, true, '')))[1]::text AS n FROM unnest(ARRAY[$LIST]) t WHERE to_regclass(format('%I', t)) IS NOT NULL) x WHERE n <> '0'"
              echo "Rows before: $(pg psql "$DST_PG" -tAc "$COUNTS")"
              pg psql "$DST_PG" -v ON_ERROR_STOP=1 -q <<SQL
            SET lock_timeout = '60s';
            BEGIN;
            DO \$\$
            DECLARE names text;
            BEGIN
              SELECT string_agg(format('%I', t), ', ') INTO names
                FROM unnest(ARRAY[$LIST]) t WHERE to_regclass(format('%I', t)) IS NOT NULL;
              EXECUTE 'TRUNCATE ' || names || ' RESTART IDENTITY';
            END \$\$;
            -- Numbering starts again from 1.
            DO \$\$
            DECLARE s text;
            BEGIN
              IF to_regclass('tran_code_sequences') IS NOT NULL THEN
                FOR s IN SELECT unnest(ARRAY[sequence_name, off_sequence_name]) FROM tran_code_sequences LOOP
                  IF s IS NOT NULL AND to_regclass(s) IS NOT NULL THEN PERFORM setval(s, 1, false); END IF;
                END LOOP;
              END IF;
              IF to_regclass('order_region_sequences') IS NOT NULL THEN DELETE FROM order_region_sequences; END IF;
            END \$\$;
            COMMIT;
            SQL
              echo "Rows after (non-empty only): $(pg psql "$DST_PG" -tAc "$COUNTS")"
              echo "Transactions cleared in $NEW_DB."
              exit 0
            fi

            if [ "$STEP" = all ]; then
              # 1. Database copy. Created if missing; filled only while it has no tables
              #    (an existing database with data is never touched).
              EXISTS=$(pg psql "$SRC_PG" -tAc "SELECT 1 FROM pg_database WHERE datname = '$NEW_DB'" | tr -d '[:space:]')
              [ "$EXISTS" = 1 ] || pg psql "$SRC_PG" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$NEW_DB\""

              # The demo connects through PgBouncer (6432), which only knows the databases
              # listed in its config. If it does not know the new one, demo2 talks to
              # PostgreSQL itself on 5432.
              # PgBouncer: add the new database next to the demo's line (same server
              # and options, only the name changes). Backup first; reload keeps the
              # demo's connections. Nothing from the file is printed.
              if ! pg psql "$DST_PG" -tAc "SELECT 1" >/dev/null 2>&1; then
                INIS=""; OWNER=""
                [ -f /etc/pgbouncer/pgbouncer.ini ] && INIS="/etc/pgbouncer/pgbouncer.ini=host"
                for c in $(docker ps --format '{{.Names}}'); do
                  for m in $(docker inspect -f '{{range .Mounts}}{{.Source}} {{end}}' "$c"); do
                    for f in "$m" "$m/pgbouncer.ini"; do
                      case "$f" in *.ini) $SUDO test -f "$f" && $SUDO grep -q '^\[databases\]' "$f" && INIS="$INIS $f=$c";; esac
                    done
                  done
                done
                for entry in $INIS; do
                  ini=${entry%=*}; who=${entry##*=}
                  if $SUDO grep -qE "^[[:space:]]*$NEW_DB[[:space:]]*=" "$ini"; then echo "PgBouncer already lists $NEW_DB ($ini)."; continue; fi
                  $SUDO grep -qE "^[[:space:]]*$SRC_DB[[:space:]]*=" "$ini" || continue
                  $SUDO cp -p "$ini" "$ini.bak-before-demo2"
                  $SUDO awk -v src="$SRC_DB" -v dst="$NEW_DB" '
                    { print }
                    !done && $0 ~ "^[[:space:]]*" src "[[:space:]]*=" {
                      l = $0; sub("^[[:space:]]*" src, dst, l)
                      sub("dbname=" src "([[:space:]]|$)", "dbname=" dst " ", l)
                      print l; done = 1
                    }' "$ini.bak-before-demo2" | $SUDO tee "$ini" >/dev/null
                  if [ "$who" = host ]; then
                    $SUDO systemctl reload pgbouncer 2>/dev/null || $SUDO pkill -HUP -x pgbouncer
                  else
                    docker kill -s HUP "$who" >/dev/null
                  fi
                  echo "Added $NEW_DB to PgBouncer ($ini, backup .bak-before-demo2) and reloaded it."
                  sleep 3
                done
              fi

              if ! pg psql "$DST_PG" -tAc "SELECT 1" >/dev/null 2>&1; then
                DIRECT_BASE=$(echo "$BASE" | sed -E 's#:6432$#:5432#')
                if [ "$DIRECT_BASE" != "$BASE" ] && pg psql "$DIRECT_BASE/$NEW_DB" -tAc "SELECT 1" >/dev/null 2>&1; then
                  DST_PG="$DIRECT_BASE/$NEW_DB"; DST_PORT=5432
                  echo "PgBouncer does not list $NEW_DB — demo2 connects to PostgreSQL directly (port 5432)."
                else
                  echo "Cannot reach $NEW_DB through PgBouncer (6432) or PostgreSQL (5432)."
                  echo "Add $NEW_DB to the [databases] section of pgbouncer.ini (same line as the demo's database), reload PgBouncer, run again."
                  exit 1
                fi
              fi

              TABLES=$(pg psql "$DST_PG" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | tr -d '[:space:]')
              if [ "$TABLES" != 0 ]; then
                echo "Database $NEW_DB already has $TABLES tables — not touching it."
              else
                pg pg_dump "$SRC_PG" -Fc -f /work/demo.dump
                pg pg_restore --no-owner --no-acl -d "$DST_PG" /work/demo.dump
                rm -f /tmp/demo2-setup/demo.dump
                echo "Copied. Tables: $(pg psql "$DST_PG" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | tr -d '[:space:]')"
              fi

              # 2. ~/demo2/.env = the demo's, with its own database and address.
              mkdir -p ~/demo2
              if [ -f ~/demo2/.env ]; then
                echo "~/demo2/.env already exists — kept as it is."
              else
                sed -E \
                  -e "s#^(DATABASE_URL=\"?[^\"?]*/)[^/?\"]+#\1$NEW_DB#" \
                  -e "${DST_PORT:+s#^(DATABASE_URL=\"?[^\"?]*):6432/#\1:$DST_PORT/#}" \
                  -e "s#^NEXTAUTH_URL=.*#NEXTAUTH_URL=https://$DOMAIN#" \
                  ~/demo/.env > ~/demo2/.env
                chmod 600 ~/demo2/.env
                grep -q "/$NEW_DB" ~/demo2/.env || { echo "Could not set the database in ~/demo2/.env"; rm ~/demo2/.env; exit 1; }
                echo "~/demo2/.env written."
              fi

              # 3. Uploaded files (product images etc.) — a copy, so the sites never share new uploads.
              if [ ! -d /var/www/uploads-demo2 ]; then
                $SUDO cp -a /var/www/uploads /var/www/uploads-demo2 2>/dev/null || $SUDO mkdir -p /var/www/uploads-demo2
              fi

              # 4. The demo2 container (same image as demo).
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
              docker pull "$IMAGE"
              docker stop demo2 2>/dev/null || true
              docker rm demo2 2>/dev/null || true
              docker run -d --env-file ~/demo2/.env -p 127.0.0.1:$PORT:3030 -v /var/www/uploads-demo2:/app/public/uploads --name demo2 --restart unless-stopped "$IMAGE"
              sleep 15
              echo "demo2 answers locally with HTTP $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$PORT/ || echo none)"
            fi

            # 5. nginx site for the new address (a fresh file; the demo's file is not changed).
            if command -v nginx >/dev/null; then
              CONF=/etc/nginx/sites-available/$DOMAIN
              [ -d /etc/nginx/sites-available ] || CONF=/etc/nginx/conf.d/$DOMAIN.conf
              if [ ! -f "$CONF" ]; then
                printf '%s\n' \
                  "server {" \
                  "    listen 80;" \
                  "    server_name $DOMAIN;" \
                  "    client_max_body_size 50m;" \
                  "    location / {" \
                  "        proxy_pass http://127.0.0.1:$PORT;" \
                  "        proxy_http_version 1.1;" \
                  "        proxy_set_header Upgrade \$http_upgrade;" \
                  "        proxy_set_header Connection \"upgrade\";" \
                  "        proxy_set_header Host \$host;" \
                  "        proxy_set_header X-Real-IP \$remote_addr;" \
                  "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" \
                  "        proxy_set_header X-Forwarded-Proto \$scheme;" \
                  "        proxy_read_timeout 300;" \
                  "    }" \
                  "}" | $SUDO tee "$CONF" >/dev/null
                [ -d /etc/nginx/sites-enabled ] && $SUDO ln -sf "$CONF" /etc/nginx/sites-enabled/
                echo "nginx site written: $CONF"
              fi
              $SUDO nginx -t && $SUDO systemctl reload nginx

              # 6. SSL — only once the address points at this server.
              MYIP=$(curl -s https://api.ipify.org || true)
              # Public DNS (the server's own lookup may answer from /etc/hosts).
              DNSIP=$(curl -s "https://dns.google/resolve?name=$DOMAIN&type=A" | grep -o '"data":"[0-9.]*"' | head -1 | cut -d'"' -f4 || true)
              if [ -n "$DNSIP" ] && [ "$DNSIP" = "$MYIP" ]; then
                $SUDO certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --redirect --keep-until-expiring \
                  && echo "SSL done: https://$DOMAIN"
              else
                echo "SSL skipped: $DOMAIN points to '${DNSIP:-nothing}', this server is $MYIP."
                echo "Add the DNS A record, wait, then run this workflow again with step=ssl."
              fi
            else
              echo "nginx not found on this server — the site runs on 127.0.0.1:$PORT; point your web server at it."
            fi
            echo "Finished."
