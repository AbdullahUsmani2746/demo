name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build --no-cache . -t ghcr.io/${{ secrets.GHCR_USERNAME }}/demo:latest --platform linux/amd64

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/demo:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2746
          script: |
            cd demo
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            docker stop demo || true
            docker rm demo || true
            docker image rm ghcr.io/${{ secrets.GHCR_USERNAME }}/demo:latest || true
            docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/demo:latest
            docker run -d --env-file .env -p 127.0.0.1:3030:3030 -v /var/www/uploads:/app/public/uploads --name demo --restart unless-stopped ghcr.io/${{ secrets.GHCR_USERNAME }}/demo:latest