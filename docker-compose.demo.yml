# Demo database for the Bizlogist ERP demo server. Made-up data only —
# never point this app at a client database.
name: bizlogist-demo
services:
  db:
    image: postgres:17-alpine
    container_name: bizlogist-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_only
      POSTGRES_DB: bizlogist_demo
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
